<!doctype html>
<html><head><meta charset="utf-8">
<style>
*{{margin:0;padding:0;box-sizing:border-box}}
html,body{{width:1080px;height:1080px;overflow:hidden}}
body{{position:relative;font-family:'Poppins',sans-serif;color:#fff;
  background:radial-gradient(ellipse 70% 55% at 58% 38%,#7a4326 0%,#55291a 40%,#33170c 75%,#220d06 100%);}}
/* drapes */
.drape{{position:absolute;top:0;bottom:250px;width:150px;opacity:.9;
  background:repeating-linear-gradient(90deg,#4b1f10 0 14px,#6a2c17 22px,#3a160a 34px,#5a2513 46px);}}
.drape.l{{left:0;-webkit-mask:linear-gradient(90deg,#000 30%,transparent);border-radius:0 0 80px 0}}
.drape.r{{right:0;-webkit-mask:linear-gradient(270deg,#000 30%,transparent);border-radius:0 0 0 80px}}
.valance{{position:absolute;left:0;right:0;top:0;height:60px;background:linear-gradient(#1c0904,transparent)}}
.bokeh{{position:absolute;border-radius:50%;filter:blur(22px);background:#e8a54b;opacity:.18}}
/* table */
.table{{position:absolute;left:0;right:0;bottom:0;height:300px;
  background:linear-gradient(#6a3a1f 0,#4c2713 8%,#3a1d0e 60%,#241008 100%);}}
.table::before{{content:"";position:absolute;inset:0;opacity:.25;
  background:repeating-linear-gradient(178deg,transparent 0 9px,rgba(0,0,0,.35) 10px,transparent 12px 23px)}}
.table::after{{content:"";position:absolute;left:0;right:0;top:0;height:6px;background:linear-gradient(90deg,transparent,#a8683a,transparent);opacity:.6}}
/* logo */
.logo{{position:absolute;left:40px;top:34px;width:330px;background:#fff;border-radius:16px;padding:8px 10px;
  box-shadow:0 8px 24px rgba(0,0,0,.45)}}
.logo img{{width:100%;display:block;clip-path:inset(2px 3px 2px 3px)}}
.city{{position:absolute;left:40px;top:222px;width:330px;text-align:center;font:600 36px 'Poppins';
  text-shadow:0 3px 8px rgba(0,0,0,.6)}}
/* titles */
.script{{position:absolute;left:390px;right:30px;top:10px;text-align:center;font-family:'Great Vibes';font-size:160px;line-height:1.1;
  white-space:nowrap;background:linear-gradient(180deg,#fff3c2 10%,#e9b65a 45%,#b27a26 70%,#f6d37f 95%);
  -webkit-background-clip:text;color:transparent;filter:drop-shadow(0 4px 6px rgba(0,0,0,.55))}}
.headline{{position:absolute;left:390px;right:30px;top:168px;text-align:center;font:900 168px/1 'Poppins';letter-spacing:2px;
  white-space:nowrap;text-shadow:0 6px 0 rgba(0,0,0,.25),0 10px 24px rgba(0,0,0,.6)}}
.hook{{position:absolute;left:390px;right:30px;top:336px;text-align:center;font:italic 600 30px 'Playfair Display';color:#f3cf7d;
  text-shadow:0 2px 6px rgba(0,0,0,.7)}}
/* offer columns */
.cols{{position:absolute;left:140px;right:40px;top:392px;display:flex;align-items:center}}
.col{{flex:1;min-width:0;text-align:center;white-space:nowrap;font:600 37px/1.15 'Playfair Display';padding:0 12px;text-shadow:0 2px 6px rgba(0,0,0,.7)}}
.col+.col{{border-left:3px solid;border-image:linear-gradient(transparent,#e3b35b,transparent) 1}}
/* price pill */
.pillwrap{{position:absolute;left:0;right:0;top:540px;display:flex;justify-content:center;padding-left:100px}}
.pill{{position:relative;padding:4px;border-radius:70px;background:linear-gradient(#8a5a1e,#3b2208);box-shadow:0 10px 28px rgba(0,0,0,.6)}}
.pill span{{display:block;padding:4px 56px 8px;border-radius:64px;border:3px solid #fff6d6;
  background:linear-gradient(180deg,#fff7d6 0%,#f2d48a 35%,#d9a845 60%,#f7dc95 100%);
  font:900 82px/1.1 'Poppins';color:#2b1407;letter-spacing:1px}}
.save{{position:absolute;right:-74px;top:-46px;width:118px;height:118px;border-radius:50%;background:radial-gradient(#d23a26,#8e1a0e);
  border:4px solid #f2d48a;transform:rotate(12deg);text-align:center;font:700 20px/1.1 'Poppins';padding-top:24px;color:#fff;
  box-shadow:0 6px 16px rgba(0,0,0,.5)}}
.save b{{font-size:38px;font-weight:900}}
.svc{{position:absolute;left:0;right:0;top:668px;text-align:center;padding-left:100px;font:600 31px 'Poppins';letter-spacing:4px;
  text-shadow:0 2px 6px rgba(0,0,0,.7)}}
.svc i{{font-style:normal;color:#e3b35b;margin:0 16px}}
.fine{{position:absolute;left:0;right:0;bottom:4px;text-align:center;font:500 15px 'Poppins';color:#e8cfa0;opacity:.8;letter-spacing:.5px;z-index:3}}
/* dishes */
.dish{{position:absolute;filter:drop-shadow(0 18px 18px rgba(0,0,0,.6))}}
/* footer */
.foot{{position:absolute;left:34px;right:34px;bottom:26px;display:flex;justify-content:space-between;align-items:flex-end;z-index:5;
  text-shadow:0 2px 6px rgba(0,0,0,.9)}}
.order{{display:inline-flex;align-items:center;gap:8px;background:#fff;color:#7a1d10;border-radius:30px;padding:4px 16px 4px 6px;
  font:700 18px 'Poppins';text-shadow:none;margin-bottom:6px}}
.order em{{display:inline-block;width:24px;height:24px;border-radius:50%;background:#7a1d10;position:relative}}
.order em::after{{content:"";position:absolute;left:9px;top:6px;border-left:9px solid #fff;border-top:6px solid transparent;border-bottom:6px solid transparent}}
.url{{font:800 30px 'Poppins';letter-spacing:.5px}}
.addr{{text-align:right;white-space:nowrap;font:600 23px/1.35 'Poppins'}}
.foot .shade{{position:absolute;inset:-30px -34px -22px;background:linear-gradient(transparent,rgba(0,0,0,.55));z-index:-1}}
</style></head>
<body>
<div class="drape l"></div><div class="drape r"></div><div class="valance"></div>
<div class="bokeh" style="left:820px;top:560px;width:90px;height:90px"></div>
<div class="bokeh" style="left:160px;top:420px;width:70px;height:70px"></div>
<div class="bokeh" style="left:960px;top:330px;width:60px;height:60px;background:#ffcf7a"></div>
<div class="table"></div>

<div class="logo"><img src="{logo}"></div>
<div class="city">Mooresville, NC</div>
<div class="script fit">{script}</div>
<div class="headline fit">{headline}</div>
{hook}
<div class="cols">{cols}</div>
<div class="pillwrap"><div class="pill"><span>ONLY ${price}!</span>{badge}</div></div>
<div class="svc">DINE-IN<i>|</i>TAKEOUT<i>|</i>DELIVERY</div>
<div class="fine">{fine}</div>

{dishes}

<div class="foot"><div class="shade"></div>
  <div><div class="order"><em></em>ORDER NOW</div><div class="url">WWW.AROMAMOORESVILLE.COM</div></div>
  <div class="addr">128 ARGUS LANE, MOORESVILLE, NC 28117<br>(704) 632-5045</div>
</div>
<script>
(function(){{const c=document.querySelector('.cols');let fs=37;
 const over=()=>c.offsetHeight>136||[...c.children].some(x=>x.scrollWidth>x.clientWidth+1);
 while(over()&&fs>24){{fs-=1;c.querySelectorAll('.col').forEach(x=>x.style.fontSize=fs+'px');}}
 c.style.top=(document.querySelector('.hook')?378:392)+(136-c.offsetHeight)/2+'px';}})();

document.querySelectorAll('.fit').forEach(el=>{{
  let fs=parseFloat(getComputedStyle(el).fontSize);
  const max=el.clientWidth;
  const probe=document.createElement('span');probe.textContent=el.textContent;el.textContent='';el.appendChild(probe);
  while(probe.offsetWidth>max-10 && fs>40){{fs-=4;el.style.fontSize=fs+'px';}}
}});
</script>
</body></html>
